name: A game does not run right on MacBox
description: A crash, wrong picture, no sound, or hang on Apple Silicon, with the run's report.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Every run writes a report and a log to the CrossOver bottle's `%LOCALAPPDATA%\XCL\<title>\logs\` (`report.json`, `xcl.log`; the previous run's are `report.prev.json`, `xcl.prev.log`). Please attach both after removing personal paths or names.

        Do not attach or link game files, dumps or anything from a game package. XCL works only on unpacked games you own and does not help with DRM.
  - type: input
    id: game
    attributes:
      label: Game and package version
      description: The name, and `Identity Name` / `Version` from the game's `MicrosoftGame.config` if you can.
      placeholder: "Minecraft Preview – Microsoft.MinecraftBeta 1.18.3064.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see or hear, and when (at start, a menu, in game). What you expected instead.
    validations:
      required: true
  - type: input
    id: macbox
    attributes:
      label: MacBox commit
      description: The commit you built (`git rev-parse HEAD`) and whether you changed any files.
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Apple chip and memory
      placeholder: "Apple M5 Max, 64 GB"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "The version and build from `sw_vers`."
      placeholder: "macOS 27.2 (26B123)"
    validations:
      required: true
  - type: input
    id: crossover
    attributes:
      label: CrossOver version and graphics backend
      description: Include the CrossOver version, bottle type, and graphics backend.
      placeholder: "CrossOver 26.3, Windows 10 64-bit bottle, D3DMetal"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: report.json and xcl.log
      description: Attach both files after removing personal paths, user names, and other private information.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: What `scripts/macos.sh run` printed at the start and after the game exited; include environment overrides.
      render: text
